name: Build Stormline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK and pinned NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"

      - name: Use stable API 36 for CI build
        shell: bash
        run: |
          set -euo pipefail

          # Stormline does not use Android 17-only APIs. The uploaded project
          # was configured for preview API 37, whose package currently fails
          # to install reliably on GitHub's headless runner. Build against the
          # stable API 36 SDK instead.
          sed -i \
            -e 's/compileSdk = 37/compileSdk = 36/' \
            -e 's/targetSdkVersion 37/targetSdkVersion 36/' \
            app/build.gradle

          echo "Android configuration used by CI:"
          grep -nE 'compileSdk|targetSdkVersion|ndkVersion' app/build.gradle

          grep -q 'compileSdk = 36' app/build.gradle
          grep -q 'targetSdkVersion 36' app/build.gradle

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project and toolchain
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          chmod +x gradlew

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Gradle version:"
          ./gradlew --version

          echo
          echo "Installed Android packages:"
          ls -ld \
            "$ANDROID_SDK_ROOT/platforms/android-36" \
            "$ANDROID_SDK_ROOT/build-tools/36.0.0" \
            "$ANDROID_SDK_ROOT/ndk/27.3.13750724"

      - name: Build Stormline debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Expected APK was not created:"
            echo "$APK_FILE"
            echo
            echo "APK files found:"
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK_FILE" apk-output/Stormline-debug.apk

          sha256sum apk-output/Stormline-debug.apk \
            > apk-output/Stormline-debug.apk.sha256

          ls -lh apk-output/

      - name: Upload Stormline APK
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Debug-APK
          path: |
            apk-output/Stormline-debug.apk
            apk-output/Stormline-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload useful diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Build-Failure
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            app/.cxx/**/build_command.txt
            app/.cxx/**/android_gradle_build.json
            app/build.gradle
            build.gradle
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: ignore
          retention-days: 7

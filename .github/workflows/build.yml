name: Build Stormline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK and pinned NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          # Android 17 / API 37 is currently a preview SDK.
          # Channel 3 makes stable, beta, dev, and canary packages visible.
          sdkmanager --install "cmdline-tools;latest" --channel=3

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "Looking for Android API 37..."
          if ! sdkmanager --list --channel=3 | grep -q "platforms;android-37"; then
            echo "ERROR: platforms;android-37 is still not visible."
            echo "Relevant packages returned by sdkmanager:"
            sdkmanager --list --channel=3 |
              grep -E "platforms;android-3[67]|build-tools;3[67]" |
              head -100 || true
            exit 1
          fi

          # Select the newest available 37.x build-tools package rather than
          # assuming a specific preview revision.
          BUILD_TOOLS_PACKAGE="$(
            sdkmanager --list --channel=3 |
            awk -F'|' '
              /^[[:space:]]*build-tools;37\./ {
                package=$1
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", package)
                print package
              }
            ' |
            sort -V |
            tail -n 1
          )"

          if [ -z "${BUILD_TOOLS_PACKAGE:-}" ]; then
            echo "ERROR: No Android 37 build-tools package is visible."
            sdkmanager --list --channel=3 |
              grep -E "build-tools;3[67]" |
              head -100 || true
            exit 1
          fi

          echo "Installing:"
          echo "  platforms;android-37"
          echo "  $BUILD_TOOLS_PACKAGE"
          echo "  ndk;27.3.13750724"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "$BUILD_TOOLS_PACKAGE" \
            --channel=3

          sdkmanager --install "ndk;27.3.13750724"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project and Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -d "$ANDROID_SDK_ROOT/platforms/android-37"
          test -d "$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          chmod +x gradlew

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Gradle version:"
          ./gradlew --version

          echo
          echo "Installed Android 37 files:"
          ls -la "$ANDROID_SDK_ROOT/platforms/android-37" | head -50

      - name: Build Stormline debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Expected APK was not created:"
            echo "$APK_FILE"
            echo
            echo "APK files found:"
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK_FILE" apk-output/Stormline-debug.apk

          sha256sum apk-output/Stormline-debug.apk \
            > apk-output/Stormline-debug.apk.sha256

          ls -lh apk-output/

      - name: Upload Stormline APK
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Debug-APK
          path: |
            apk-output/Stormline-debug.apk
            apk-output/Stormline-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload useful diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Build-Failure
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            app/.cxx/**/build_command.txt
            app/.cxx/**/android_gradle_build.json
          if-no-files-found: ignore
          retention-days: 7

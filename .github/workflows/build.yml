name: Build Stormline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install current command-line tools
        shell: bash
        run: |
          set -euo pipefail

          BOOTSTRAP_SDKMANAGER="$(command -v sdkmanager)"

          echo "Bootstrap sdkmanager:"
          echo "$BOOTSTRAP_SDKMANAGER"
          "$BOOTSTRAP_SDKMANAGER" --version || true

          yes | "$BOOTSTRAP_SDKMANAGER" --licenses >/dev/null || true

          # API 37 is currently on a preview channel. First use the runner's
          # sdkmanager only to download a current command-line tools package.
          "$BOOTSTRAP_SDKMANAGER" \
            --install "cmdline-tools;latest" \
            --channel=3

          # setup-android already contains a directory named "latest", so the
          # newly downloaded package may be installed as latest-2/latest-3.
          # Select the most recently written sdkmanager explicitly.
          SDKMANAGER="$(
            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f \
              -path "*/bin/sdkmanager" \
              -printf '%T@ %p\n' |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-
          )"

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Could not locate the newly installed sdkmanager."
            find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 4 -print | sort
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo
          echo "Current sdkmanager selected:"
          echo "$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android 17 SDK and pinned NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo "Looking for Android API 37..."

          if ! "$SDKMANAGER" --list --channel=3 |
               grep -q "platforms;android-37"; then
            echo "ERROR: platforms;android-37 is not visible."
            echo
            echo "Relevant packages:"
            "$SDKMANAGER" --list --channel=3 |
              grep -E "platforms;android-3[67]|build-tools;3[67]" |
              head -100 || true
            exit 1
          fi

          BUILD_TOOLS_PACKAGE="$(
            "$SDKMANAGER" --list --channel=3 |
            awk -F'|' '
              /^[[:space:]]*build-tools;37\./ {
                package=$1
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", package)
                print package
              }
            ' |
            sort -V |
            tail -n 1
          )"

          if [ -z "${BUILD_TOOLS_PACKAGE:-}" ]; then
            echo "ERROR: No Android 37 build-tools package is visible."
            "$SDKMANAGER" --list --channel=3 |
              grep -E "build-tools;3[67]" |
              head -100 || true
            exit 1
          fi

          echo "Installing:"
          echo "  platform-tools"
          echo "  platforms;android-37"
          echo "  $BUILD_TOOLS_PACKAGE"
          echo "  ndk;27.3.13750724"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-37" \
            "$BUILD_TOOLS_PACKAGE" \
            "ndk;27.3.13750724" \
            --channel=3

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project and Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -d "$ANDROID_SDK_ROOT/platforms/android-37"
          test -d "$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          chmod +x gradlew

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Gradle version:"
          ./gradlew --version

          echo
          echo "Installed Android 37 platform:"
          ls -la "$ANDROID_SDK_ROOT/platforms/android-37" | head -50

          echo
          echo "Installed Android 37 build tools:"
          find "$ANDROID_SDK_ROOT/build-tools" \
            -mindepth 1 -maxdepth 1 -type d -name "37*" -print | sort

          echo
          echo "Installed NDK:"
          ls -ld "$ANDROID_SDK_ROOT/ndk/27.3.13750724"

      - name: Build Stormline debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Expected APK was not created:"
            echo "$APK_FILE"
            echo
            echo "APK files found:"
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK_FILE" apk-output/Stormline-debug.apk

          sha256sum apk-output/Stormline-debug.apk \
            > apk-output/Stormline-debug.apk.sha256

          ls -lh apk-output/

      - name: Upload Stormline APK
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Debug-APK
          path: |
            apk-output/Stormline-debug.apk
            apk-output/Stormline-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload useful diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Build-Failure
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            app/.cxx/**/build_command.txt
            app/.cxx/**/android_gradle_build.json
          if-no-files-found: ignore
          retention-days: 7

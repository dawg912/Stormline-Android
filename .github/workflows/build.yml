name: Build Stormline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Stormline-1.0.0-source.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Stormline project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/Stormline-1.0.0-source.zip"
          EXTRACT_DIR="$RUNNER_TEMP/stormline-project"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Missing project ZIP:"
            echo "$ZIP_FILE"
            echo
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -print | sort
            exit 1
          fi

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SETTINGS_FILE="$(
            find "$EXTRACT_DIR" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print |
            sort |
            head -n 1
          )"

          if [ -z "${SETTINGS_FILE:-}" ]; then
            echo "ERROR: Could not find settings.gradle after extraction."
            find "$EXTRACT_DIR" -maxdepth 4 -print | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          test -f "$PROJECT_DIR/build.gradle" || test -f "$PROJECT_DIR/build.gradle.kts"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/app/build.gradle" || test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/gradlew"
          test -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Using project:"
          echo "$PROJECT_DIR"

          echo
          echo "Project root:"
          find "$PROJECT_DIR" -maxdepth 2 -print | sort | head -200

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install stable Android SDK and pinned NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"

      - name: Configure stable API 36
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          APP_GRADLE="app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: This workflow expects app/build.gradle."
            exit 1
          fi

          # The app does not use Android 17-only APIs, so CI builds against
          # stable API 36 instead of the API 37 preview SDK.
          sed -i \
            -e 's/compileSdk = 37/compileSdk = 36/' \
            -e 's/targetSdkVersion 37/targetSdkVersion 36/' \
            "$APP_GRADLE"

          echo "Android configuration used by CI:"
          grep -nE 'compileSdk|targetSdkVersion|ndkVersion' "$APP_GRADLE"

          grep -q 'compileSdk = 36' "$APP_GRADLE"
          grep -q 'targetSdkVersion 36' "$APP_GRADLE"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Verify toolchain
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/27.3.13750724"

          chmod +x gradlew

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Gradle version:"
          ./gradlew --version

          echo
          echo "Installed Android packages:"
          ls -ld \
            "$ANDROID_SDK_ROOT/platforms/android-36" \
            "$ANDROID_SDK_ROOT/build-tools/36.0.0" \
            "$ANDROID_SDK_ROOT/ndk/27.3.13750724"

      - name: Build Stormline debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Expected APK was not created:"
            echo "$APK_FILE"
            echo
            echo "APK files found:"
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          OUTPUT_DIR="$GITHUB_WORKSPACE/apk-output"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          cp "$APK_FILE" "$OUTPUT_DIR/Stormline-debug.apk"

          sha256sum "$OUTPUT_DIR/Stormline-debug.apk" \
            > "$OUTPUT_DIR/Stormline-debug.apk.sha256"

          ls -lh "$OUTPUT_DIR"

      - name: Upload Stormline APK
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Debug-APK
          path: |
            apk-output/Stormline-debug.apk
            apk-output/Stormline-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload useful diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Build-Failure
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
            ${{ env.PROJECT_DIR }}/app/.cxx/**/build_command.txt
            ${{ env.PROJECT_DIR }}/app/.cxx/**/android_gradle_build.json
            ${{ env.PROJECT_DIR }}/app/build.gradle
            ${{ env.PROJECT_DIR }}/build.gradle
            ${{ env.PROJECT_DIR }}/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: ignore
          retention-days: 7

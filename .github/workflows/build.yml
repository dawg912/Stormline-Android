name: Build Stormline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install Android packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager             "platform-tools"             "platforms;android-37"             "build-tools;37.0.0"             "ndk;27.3.13750724"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo
          echo "Installed Android packages:"
          sdkmanager --list_installed

      - name: Build Stormline debug APK
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew             --no-daemon             --stacktrace             clean             assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Expected APK was not created:"
            echo "$APK_FILE"
            echo
            echo "APK files found:"
            find . -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK_FILE" apk-output/Stormline-debug.apk

          sha256sum apk-output/Stormline-debug.apk             > apk-output/Stormline-debug.apk.sha256

          ls -lh apk-output/

      - name: Upload Stormline APK
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Debug-APK
          path: |
            apk-output/Stormline-debug.apk
            apk-output/Stormline-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Stormline-Build-Failure
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
